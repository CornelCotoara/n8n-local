# Plain HTTP on the internal network — matches N8N_PROTOCOL=http in
# configmap.yaml. Switch both together if you add TLS later (entryPoint
# websecure + tls block here, N8N_PROTOCOL=https + WEBHOOK_URL=https://...
# in configmap.yaml) — they must stay in sync or webhook URLs break.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: n8n
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`n8n.home.arpa`)
      kind: Rule
      services:
        - name: n8n
          port: 80
