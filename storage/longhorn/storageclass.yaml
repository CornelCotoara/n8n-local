apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-replicated
provisioner: driver.longhorn.io
allowVolumeExpansion: true
# Retain, not Delete: if the PVC is ever deleted by mistake (e.g. during a
# kustomize apply mishap), the underlying Longhorn volume and its data stay
# around for manual recovery instead of being wiped immediately.
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
