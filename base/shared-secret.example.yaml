apiVersion: v1
kind: Secret
metadata:
  name: n8n-shared-secret
  namespace: n8n
stringData:
  # Same value consumed by two different env var names:
  #   postgres/statefulset.yaml -> POSTGRES_PASSWORD  (sets the role's password)
  #   n8n/deployment.yaml       -> DB_POSTGRESDB_PASSWORD (n8n connects with it)
  # Stored once here, so there's nothing to keep in sync manually.
  postgres-password: REPLACE_ME

  # n8n's credential-encryption key. Generate with: openssl rand -hex 32
  # Losing this after workflows exist means all stored credentials
  # (OpenAI/Gemini/Dahl keys, etc.) become undecryptable — back it up.
  n8n-encryption-key: REPLACE_ME
