apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
data:
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "n8n-postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "n8n"
  N8N_HOST: "n8n.home.arpa"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  WEBHOOK_URL: "http://n8n.home.arpa/"
  GENERIC_TIMEZONE: "Europe/Bucharest"
  N8N_RUNNERS_ENABLED: "true"
  # Browsers only treat `localhost` as a secure context over plain HTTP —
  # a real hostname like n8n.home.arpa over HTTP gets its Secure cookie
  # rejected, so the browser never actually logs in. Turn this back to
  # "true" (or remove it) once TLS is added on the websecure entrypoint.
  N8N_SECURE_COOKIE: "false"
