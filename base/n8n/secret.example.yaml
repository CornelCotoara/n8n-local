apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
stringData:
  # Generate once with: openssl rand -hex 32
  # Losing this after workflows exist means all stored credentials
  # (OpenAI/Gemini/Dahl keys, etc.) become undecryptable — back it up.
  N8N_ENCRYPTION_KEY: REPLACE_ME
  DB_POSTGRESDB_PASSWORD: REPLACE_ME
  # OpenAI / Gemini / Dahl API keys are NOT set here — n8n stores them
  # as encrypted credentials in its own DB, entered through the UI
  # (Credentials → New → OpenAI, with Base URL overridden for Dahl).
