# Adjust `match` host and `entryPoints` to match your existing Traefik
# setup (same pattern as the Pi-hole IngressRoute already in the cluster).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: n8n
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`n8n.home.arpa`)
      kind: Rule
      services:
        - name: n8n
          port: 80
  tls: {}
